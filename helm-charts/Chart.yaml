# Those values are set by Maven filtering
# and will be replaced with a valid version number during the build process.
apiVersion: v2
name: @project.artifactId@-chart
description: A Helm chart for Spring 6 Project
type: application
version: @helm.chart.version@
appVersion: @helm.chart.version@

dependencies:
  - name: kbe-brewery-gateway-mysql-chart
    alias: mysql
    version: @helm.chart.version@
    repository: file://charts/mysql
    condition: mysql.enabled

  - name: kbe-brewery-gateway-jms-chart
    alias: jms
    version: @helm.chart.version@
    repository: file://charts/jms
    condition: jms.enabled

  - name: kbe-brewery-gateway-elasticsearch-chart
    alias: elasticsearch
    version: @helm.chart.version@
    repository: file://charts/elasticsearch
    condition: elasticsearch.enabled

  - name: kbe-brewery-gateway-kibana-chart
    alias: kibana
    version: @helm.chart.version@
    repository: file://charts/kibana
    condition: kibana.enabled

  - name: kbe-brewery-gateway-filebeat-chart
    alias: filebeat
    version: @helm.chart.version@
    repository: file://charts/filebeat
    condition: filebeat.enabled

  - name: kbe-brewery-gateway-otel-collector-chart
    alias: otel-collector
    version: @helm.chart.version@
    repository: file://charts/otel-collector
    condition: otelCollector.enabled

  - name: kbe-brewery-gateway-apm-server-chart
    alias: apm-server
    version: @helm.chart.version@
    repository: file://charts/apm-server
    condition: apmServer.enabled

