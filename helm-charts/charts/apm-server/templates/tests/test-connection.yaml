apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "apm-server.fullname" . }}-test"
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "apm-server.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  containers:
    - name: test-apm-server
      image: {{.Values.apmServerImage.repository }}:{{.Values.apmServerImage.tag }}
      imagePullPolicy: {{.Values.apmServerImage.pullPolicy }}
      command: [ '/bin/sh', '-c' ]
      args:
        - |
          echo "### Test: APM Server Connection using service name: {{ include "apm-server.fullname" . }}"
          wget -qO- http://{{ include "apm-server.fullname" . }}:{{ .Values.service.port }}/ || exit 1
          echo "Exit code: $?"

  restartPolicy: Never
