apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "otel-collector.fullname" . }}-test"
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "otel-collector.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  containers:
    - name: test-otel-collector
      image: {{.Values.otelCollectorImage.repository }}:{{.Values.otelCollectorImage.tag }}
      imagePullPolicy: {{.Values.otelCollectorImage.pullPolicy }}
      command: [ '/bin/sh', '-c' ]
      args:
        - |
          echo "### Test: OTel Collector Connection using service name: {{ include "otel-collector.fullname" . }}"
          wget -qO- http://{{ include "otel-collector.fullname" . }}:{{ .Values.service.healthPort }}/ || exit 1
          echo "Exit code: $?"

  restartPolicy: Never
